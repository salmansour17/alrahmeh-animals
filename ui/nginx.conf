# How the stock nginx:alpine image serves the website in docker-compose.yml.
# Mounted over nginx's default site, so no Dockerfile is needed. On Azure the
# Storage static website plays this role, with the same two rules set there.

server {
    listen 80;
    root /usr/share/nginx/html;

    # React Router owns paths like /animals/3. A file that is not there gets
    # index.html, and the app shows the right page. Azure's static website does
    # the same with index.html as its 404 document.
    location / {
        try_files $uri /index.html;
        # The page and its config.js must always be checked again, so a new
        # deploy or new service addresses are picked up at once.
        add_header Cache-Control "no-cache";
    }

    # Built assets carry a hash of their content in the name (index-BjD3-Kgg.js),
    # so a changed file always gets a new name and the old one can be cached
    # for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
