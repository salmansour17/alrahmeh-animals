# Continuous integration: lint, test and build every service.
#
# Runs on every push to a branch other than main, and on every pull request,
# so nothing reaches main untested. On main, cd.yml calls this same workflow
# (workflow_call) before deploying, so it does not also run here twice.
# Nothing in this workflow touches Azure or any secret.

name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

# Read the code, nothing else. Jobs that need more ask for it themselves.
permissions:
  contents: read

# One run per branch or pull request at a time. A new push to a pull request
# cancels the run it makes obsolete; runs on branches finish. The group name
# starts with this file's own name, so when cd.yml calls several workflows
# they never share a group and cancel each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      # One service failing must not hide the results of the other two.
      fail-fast: false
      matrix:
        service: [animals, donations, enquiries]
        # CI-ONLY password for the throwaway SQL Server below. That server
        # exists only inside this job's runner for a few minutes, holds only
        # test data, and is unreachable from outside. Never reuse this value
        # anywhere else. It is written once here, as a one-value matrix entry,
        # because a service container's settings cannot read workflow `env`.
        ci-sa-password: ["CiOnly-Throwaway-Sql-1"]
    services:
      sqlserver:
        # Pinned by digest as well as tag. This image exists for linux/amd64
        # only, which is what GitHub's runners are.
        image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04@sha256:4525e3efac9f3e241cb003bb2ff2a82818b502f37e12049d788b1a9fa7e13b7f
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ matrix.ci-sa-password }}
        ports:
          - 1433:1433
        # The job's steps start only once this check passes, so the tests
        # never race a server that is still starting.
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes, so the token is not kept on disk.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          # Reuse downloaded packages between runs; the cache key changes
          # whenever this service's requirements.txt does.
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Test, failing below 70% coverage
        env:
          # The tests create their own throwaway database on this server and
          # drop it at the end (tests/conftest.py).
          TEST_SQLSERVER_URL: mssql://sa:${{ matrix.ci-sa-password }}@localhost:1433/master
        run: pytest --cov --cov-report=term-missing --cov-fail-under=70

  build:
    name: build image (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [animals, donations, enquiries]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes, so the token is not kept on disk.
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # Builds the image exactly as CD will, but keeps it: a Dockerfile that
      # does not build fails the pipeline here, before anything is deployed.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: services/${{ matrix.service }}
          push: false
          # Without this, the image gets an extra attestation entry that Azure
          # Container Apps cannot pull (the setup guide's warning).
          provenance: false
          # github.sha is the commit's hash, computed by GitHub: forty hex
          # characters no contributor can choose, so it cannot carry code.
          build-args: |
            GIT_SHA=${{ github.sha }}
