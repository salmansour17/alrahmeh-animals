# Checks the Terraform in infra/ on every push and pull request: formatting
# and validity. Neither step talks to Azure: `init -backend=false` downloads
# the provider pinned in infra/.terraform.lock.hcl and skips the state file,
# so this runs without any credentials. cd.yml calls it before deploying.

name: Terraform

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# One run per branch or pull request; a new push to a pull request cancels the
# obsolete run. Named after this file so cd.yml's calls never share a group.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: terraform fmt and validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes, so the token is not kept on disk.
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.4

      - name: Formatting
        run: terraform fmt -check -diff

      - name: Download the pinned provider, without the state backend
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate
