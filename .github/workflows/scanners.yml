# Our own, hand-written scanners (security/): SAST on the source and SCA on
# the dependencies. security.yml runs the established tools; this file runs
# ours. cd.yml calls it and deploys only if every job here passes.
#
#   scanner-tests  lint and test the scanners first: a scanner whose own tests
#                  fail cannot be trusted to say the code is clean
#   sast           security/sast.py on the services and the website source
#   sca            security/sca.py, once per service and once for the website

name: Scanners

on:
  push:
    branches-ignore: [main] # main is checked through cd.yml, before deploying
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: scanners-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scanner-tests:
    name: test the scanners
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: security
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The same Python as the service images. No pip cache: every run
      # installs from the index, so nothing a previous run left behind can
      # change what is tested.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.18"
      - name: Install test tools
        run: python -m pip install --no-cache-dir -r requirements-test.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      # Coverage must stay at 95% or more (.coveragerc).
      - name: Test
        run: python -m pytest --cov --cov-report=term-missing

  sast:
    name: sast (security/sast.py)
    needs: [scanner-tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.18"
      # Standard library only: nothing to install.
      #
      # --exclude tests is a deliberate exception. The tests hold made-up
      # passwords and keys, and their fixtures build SQL like
      # CREATE DATABASE [{name}] from constants on purpose: the scanner
      # rightly reports both (36 findings on 2026-11-25), and none of it runs
      # in the deployed services. The services' own code is scanned in full.
      - name: Scan the services and the website
        run: python security/sast.py services ui/src --exclude tests

  sca:
    name: sca (${{ matrix.target }})
    needs: [scanner-tests]
    runs-on: ubuntu-24.04
    strategy:
      # Report every target even when one fails.
      fail-fast: false
      matrix:
        include:
          - { target: animals, kind: python }
          - { target: donations, kind: python }
          - { target: enquiries, kind: python }
          - { target: ui, kind: npm }
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.18"

      # A fresh virtual environment with no pip in it, holding exactly this
      # service's requirements and what they pull in. sca.py then reads what
      # is installed there, so it checks the real transitive set, and only
      # that set (no pip, which the images remove too).
      - name: Install the service's requirements into a clean environment
        if: matrix.kind == 'python'
        run: |
          python -m venv --without-pip "$RUNNER_TEMP/venv"
          python -m pip --python "$RUNNER_TEMP/venv/bin/python" install --no-cache-dir \
            -r "services/$TARGET/requirements.txt"
      - name: Check the service's dependencies
        if: matrix.kind == 'python'
        run: >-
          "$RUNNER_TEMP/venv/bin/python" security/sca.py python
          --requirements "services/$TARGET/requirements.txt"

      # The lock file lists every package npm would install, so nothing needs
      # installing to check it.
      - name: Check the website's dependencies
        if: matrix.kind == 'npm'
        run: python security/sca.py npm --project "$TARGET"

  # DAST slots in here on Friday (2026-11-27): a `dast` job that starts the
  # stack with docker compose and runs security/dast.py against it. It will
  # need [scanner-tests] like the jobs above.
